<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFurqan - Offline</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: radial-gradient(circle at top left, #25434a 0%, transparent 45%),
        radial-gradient(circle at 20% 80%, #1a2f34 0%, transparent 55%),
        linear-gradient(140deg, #0b1c20, #11292f);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f2efe7;
    }
    
    .offline-container {
      text-align: center;
      padding: 40px;
      max-width: 480px;
    }
    
    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      border-radius: 24px;
      overflow: hidden;
    }

    .offline-icon img {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    h1 {
      font-size: 1.8rem;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    
    p {
      color: #c8c2b4;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    
    .retry-btn {
      background: linear-gradient(135deg, #d8b36a 0%, #c9a45a 100%);
      color: #0b1c20;
      border: none;
      padding: 12px 32px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(216, 179, 106, 0.3);
    }
    
    .cached-content {
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .cached-content p {
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    
    .cached-link {
      color: #6fd4b1;
      text-decoration: none;
    }
    
    .cached-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <img src="/icons/openfurqan-app-v6-192.png" alt="OpenFurqan">
    </div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      Some features may be unavailable until you're back online.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>
    <div class="cached-content">
      <p>Previously viewed surahs may still be available.</p>
      <a href="/" class="cached-link">Go to Home →</a>
    </div>
  </div>
</body>
</html>
